name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fmt --check --all
      - run: cargo clippy -p proton-api -p proton-sync --all-targets --all-features -- -D warnings
      - run: cargo test -p proton-api -p proton-sync --all-features
      - run: cargo check -p proton-bridge

  qml:
    name: QML lint (qmllint syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt QML tools
        run: sudo apt-get update && sudo apt-get install -y qtdeclarative5-dev-tools
      - name: qmllint syntax check
        # Qt 5.15 qmllint is a pure syntax verifier: it parses QML/JS with
        # QQmlJS and never resolves imports, so the Sailfish-only modules
        # (Sailfish.Silica, com.jolla.*) cannot cause false positives.
        # Non-zero exit means a real syntax error. (Verified against
        # qtdeclarative 5.15 tools/qmllint/main.cpp.)
        run: |
          export PATH="$PATH:/usr/lib/qt5/bin:/usr/lib/x86_64-linux-gnu/qt5/bin"
          command -v qmllint
          qmllint ui/*.qml
  # Cross-compilation test for aarch64 (host-only, no SDK) — needs aarch64 gcc for ring
  rust-cross:
    name: Rust cross-compile check (aarch64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Install aarch64 gcc for ring
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-cargo-cross-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo build -p proton-api -p proton-sync --release --target aarch64-unknown-linux-gnu --lib
      - run: cargo check -p proton-bridge --target aarch64-unknown-linux-gnu